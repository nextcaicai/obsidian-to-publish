<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8">
		<title>Obsidian to Publish Companion</title>
		<style>
			body {
				box-sizing: border-box;
				color: #111827;
				font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				margin: 0;
				max-width: 720px;
				padding: 24px;
			}

			.brand {
				align-items: center;
				display: flex;
				gap: 12px;
				margin: 0 0 16px;
			}

			.brand img {
				border-radius: 10px;
				display: block;
				height: 40px;
				width: 40px;
			}

			h1 {
				font-size: 20px;
				margin: 0;
			}

			label {
				display: block;
				font-weight: 600;
				margin: 16px 0 6px;
			}

			input {
				border: 1px solid #cbd5e1;
				border-radius: 6px;
				box-sizing: border-box;
				font: inherit;
				padding: 8px 10px;
				width: 100%;
			}

			button {
				background: #111827;
				border: 0;
				border-radius: 6px;
				color: #fff;
				cursor: pointer;
				font: inherit;
				margin-right: 8px;
				margin-top: 16px;
				padding: 8px 12px;
			}

			.secondary {
				background: #f1f5f9;
				color: #111827;
			}

			.status-card {
				align-items: center;
				background: #f8fafc;
				border: 1px solid #e2e8f0;
				border-radius: 8px;
				display: flex;
				gap: 10px;
				margin: 18px 0 4px;
				padding: 12px;
			}

			.status-dot {
				border-radius: 999px;
				display: inline-block;
				flex: 0 0 auto;
				height: 10px;
				width: 10px;
			}

			.status-dot.connected {
				background: #16a34a;
				box-shadow: 0 0 0 4px rgba(22, 163, 74, .14);
			}

			.status-dot.waiting {
				background: #d97706;
				box-shadow: 0 0 0 4px rgba(217, 119, 6, .14);
			}

			.status-dot.offline {
				background: #dc2626;
				box-shadow: 0 0 0 4px rgba(220, 38, 38, .12);
			}

			.status-main {
				font-weight: 700;
			}

			.status {
				color: #475569;
				margin-top: 4px;
			}
		</style>
	</head>
	<body>
		<div class="brand">
			<img src="icons/icon-48.png" alt="Obsidian to Publish Companion" width="40" height="40">
			<h1>Obsidian to Publish Companion</h1>
		</div>

		<label for="port">本地端口</label>
		<input id="port" inputmode="numeric" placeholder="27127">

		<label for="token">连接令牌</label>
		<input id="token" type="password" autocomplete="off" placeholder="从 Obsidian 插件设置复制">

		<button id="save" type="button">保存并连接</button>
		<button id="show-token" class="secondary" type="button">显示/隐藏令牌</button>
		<button id="status" class="secondary" type="button">刷新状态</button>

		<div class="status-card" aria-live="polite">
			<span id="status-dot" class="status-dot offline"></span>
			<div>
				<div id="status-main" class="status-main">未连接</div>
				<div id="status-detail" class="status"></div>
			</div>
		</div>
		<div id="message" class="status"></div>

		<script src="src/options.js"></script>
	</body>
</html>
